<script>
"use strict";
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const H=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600)%24,m=Math.floor(s%3600/60);return pad(h)+"h"+pad(m)};
const fmtS=s=>{const h=Math.floor(s/3600)%24,m=Math.floor(s%3600/60),x=Math.floor(s%60);return pad(h)+"h"+pad(m)+":"+pad(x)};
const parseT=t=>{if(!t)return null;const p=t.trim().split(":");if(p.length<2)return null;return (+p[0])*3600+(+p[1])*60+(+(p[2]||0))};
const nowSec=()=>{const d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()};
const ymd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const ymdDash=s=>s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);
const wk=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const sg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dist=(a,b,c,d)=>{const R=6371000,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t*Math.cos((a+c)*t/2);return Math.sqrt(x*x+y*y)*R};

/* ============ Base locale (IndexedDB) ============ */
const DB={
 open(){return new Promise((ok,ko)=>{try{const r=indexedDB.open("bustrajet",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}})},
 async get(k){try{const d=await this.open();return await new Promise((ok,ko)=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})}catch(e){return null}},
 async set(k,v){const d=await this.open();return new Promise((ok,ko)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})},
 async del(k){try{const d=await this.open();return new Promise(ok=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=ok})}catch(e){}}
};

/* ============ Lecture GTFS (zip + csv) ============ */
async function readZip(buf){
 const dv=new DataView(buf);let e=-1;
 for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65600);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error("Ce fichier n'est pas un zip valide.");
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={},td=new TextDecoder();
 for(let i=0;i<n;i++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
  const name=td.decode(new Uint8Array(buf,p+46,nl));
  files[name.split("/").pop().toLowerCase()]={method,csize,lho};
  p+=46+nl+el+cl;
 }
 return files;
}
async function unzipText(buf,f){
 const dv=new DataView(buf);const nl=dv.getUint16(f.lho+26,true),el=dv.getUint16(f.lho+28,true);
 const data=new Uint8Array(buf,f.lho+30+nl+el,f.csize);
 let txt;
 if(f.method===0)txt=new TextDecoder().decode(data);
 else{
  if(typeof DecompressionStream==="undefined")throw new Error("Navigateur trop ancien (mettre Chrome à jour).");
  const s=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  txt=await new Response(s).text();
 }
 return txt.charCodeAt(0)===0xFEFF?txt.slice(1):txt;
}
function parseCSV(t){
 const out=[];let row=[],i=0,n=t.length;
 while(i<n){
  let c=t[i];
  if(c==='"'){let j=i+1,s="";for(;;){const k=t.indexOf('"',j);if(k<0){s+=t.slice(j);i=n;break}s+=t.slice(j,k);if(t[k+1]==='"'){s+='"';j=k+2}else{i=k+1;break}}row.push(s)}
  else{let j=i;while(j<n&&t[j]!==","&&t[j]!=="\n"&&t[j]!=="\r")j++;row.push(t.slice(i,j));i=j}
  c=t[i];
  if(c===","){i++;if(i>=n||t[i]==="\n"||t[i]==="\r")row.push("")}
  else if(c==="\r"||c==="\n"||i>=n){if(c==="\r"&&t[i+1]==="\n")i++;i++;if(row.length>1||row[0]!=="")out.push(row);row=[]}
 }
 if(row.length>1||(row.length===1&&row[0]!==""))out.push(row);
 return out;
}
function table(txt){const r=parseCSV(txt);if(!r.length)return[];const h=r[0].map(x=>x.trim());return{h,rows:r.slice(1),ix:Object.fromEntries(h.map((k,i)=>[k,i]))}}
async function buildModel(buffers,progress){
 const M={stops:{},routes:{},trips:{},cal:{},calDates:{},meta:{files:[]}};
 let k=0;
 for(const {name,buf} of buffers){
  const pre=buffers.length>1?k+":":"";k++;
  const z=await readZip(buf);
  const need=["stops.txt","routes.txt","trips.txt","stop_times.txt"];
  for(const f of need)if(!z[f])throw new Error("Fichier "+f+" absent de "+name+" – ce n'est pas un GTFS complet.");
  progress&&progress("Lecture des arrêts…");
  let T=table(await unzipText(buf,z["stops.txt"]));
  for(const r of T.rows){M.stops[pre+r[T.ix.stop_id]]={n:r[T.ix.stop_name],la:parseFloat(r[T.ix.stop_lat]),lo:parseFloat(r[T.ix.stop_lon])}}
  progress&&progress("Lecture des lignes…");
  T=table(await unzipText(buf,z["routes.txt"]));
  for(const r of T.rows){M.routes[pre+r[T.ix.route_id]]={s:(r[T.ix.route_short_name]||"").trim(),l:(r[T.ix.route_long_name]||"").trim(),c:T.ix.route_color!=null?r[T.ix.route_color]:"",tc:T.ix.route_text_color!=null?r[T.ix.route_text_color]:""}}
  progress&&progress("Lecture des courses…");
  T=table(await unzipText(buf,z["trips.txt"]));
  for(const r of T.rows){M.trips[pre+r[T.ix.trip_id]]={r:pre+r[T.ix.route_id],s:pre+r[T.ix.service_id],h:T.ix.trip_headsign!=null?r[T.ix.trip_headsign]:"",d:T.ix.direction_id!=null?r[T.ix.direction_id]:"",st:[]}}
  progress&&progress("Lecture des horaires (peut durer un moment)…");
  T=table(await unzipText(buf,z["stop_times.txt"]));
  const ti=T.ix.trip_id,si=T.ix.stop_id,ai=T.ix.arrival_time,di=T.ix.departure_time,qi=T.ix.stop_sequence;
  for(const r of T.rows){const t=M.trips[pre+r[ti]];if(!t)continue;const a=parseT(r[ai]),d=parseT(r[di]);t.st.push([+r[qi],pre+r[si],a??d,d??a])}
  for(const id in M.trips){const t=M.trips[id];t.st.sort((x,y)=>x[0]-y[0]);t.st=t.st.map(x=>[x[1],x[2],x[3]])}
  if(z["calendar.txt"]){
   progress&&progress("Lecture des calendriers…");
   T=table(await unzipText(buf,z["calendar.txt"]));
   for(const r of T.rows){M.cal[pre+r[T.ix.service_id]]={d:wk.map(w=>r[T.ix[w]]==="1"),a:r[T.ix.start_date],b:r[T.ix.end_date]}}
  }
  if(z["calendar_dates.txt"]){
   T=table(await unzipText(buf,z["calendar_dates.txt"]));
   for(const r of T.rows){const s=pre+r[T.ix.service_id];(M.calDates[s]=M.calDates[s]||{})[r[T.ix.date]]=+r[T.ix.exception_type]}
  }
  M.meta.files.push(name);
 }
 let a="99999999",b="0";
 for(const s in M.cal){if(M.cal[s].a<a)a=M.cal[s].a;if(M.cal[s].b>b)b=M.cal[s].b}
 for(const s in M.calDates)for(const d in M.calDates[s]){if(d<a)a=d;if(d>b)b=d}
 M.meta.from=a;M.meta.to=b;M.meta.imported=Date.now();
 return M;
}

function demoModel(){
 const names=[["AULNOYE-AYMERIES - Lycée Pierre et Marie Curie","17:55"],["AULNOYE-AYMERIES - Hôtel de Ville","17:57"],["LE QUESNOY - Lycée Eug… Quai 2","18:17"],["LE QUESNOY - Gare - Quai 2","18:19"],["RAUCOURT-AU-BOIS - Village","18:26"],["ENGLEFONTAINE - Scierie","18:28"],["ROBERSART - Mairie","18:53"],["BOUSIES - Place Gén…","18:55"],["BOUSIES - Rue de Landrecies","18:57"],["FONTAINE-AU-BOIS - Place de l'Église","19:00"],["FONTAINE-AU-BOIS - La Plaine","19:01"]];
 const M={stops:{},routes:{"954S":{s:"954S",l:"LANDRECIES - LE QUESNOY",c:"E8B923",tc:"222222"}},trips:{},cal:{"ALL":{d:[1,1,1,1,1,1,1].map(Boolean),a:"20200101",b:"20991231"}},calDates:{},meta:{files:["DÉMO"],demo:true,from:"20200101",to:"20991231",imported:Date.now()}};
 const st=[];names.forEach((x,i)=>{M.stops["D"+i]={n:x[0],la:NaN,lo:NaN};const t=parseT(x[1]+":00");st.push(["D"+i,t,t])});

function voiceNav(ns,t,ci){

 const stopNm=i=>{const x=t.st[i];return x?(M.stops[x[0]]||{n:""}).n.split(" - ").pop():""};
 if(S.vci!==ci&&S.vTrip===S.tripId&&ci<t.st.length){S.vci=ci;say("Prochain arrêt : "+stopNm(ci))}
 if(S.vTrip!==S.tripId){S.vTrip=S.tripId;S.vci=ci;S.vs={};S.vOff=false;S.vEnd=false;if(ci<t.st.length)say("Guidage vocal activé. Prochain arrêt : "+stopNm(ci))}
 if(ci>=t.st.length&&!S.vEnd){S.vEnd=true;say("Terminus, trajet terminé")}
 if(!ns||!S.route)return;
 if(S.vRoute!==S.route){S.vRoute=S.route;S.vs={};S.vOff=false}
 if(ns.off)return;
 const m=ns.man;if(!m||m.k==="S"||!VTXT[m.k])return;
 const d=ns.dm,key=m.i,st=S.vs[key]||0,what=vWhat(m);
 const lvl=d<=35?3:d<=120?2:d<=450?1:0;
 if(lvl>st){S.vs[key]=lvl;
  if(lvl===1)say("Dans "+(Math.round(d/50)*50)+" mètres, "+what,true);
  else if(lvl===2)say("Dans 100 mètres, "+what,true);
  else say(what.charAt(0).toUpperCase()+what.slice(1),true)}
}
function navHTML(ns,t,ci){
 if(!S.pos)return`<div class="nv w">Recherche du GPS…</div>`;
 if(!S.route||S.route.src==="arrêts"||(ns&&ns.off)){const nx=t&&t.st[ci],ll=nx&&stopLL(nx[0]);
  const sm=(!S.route||S.route.src==="arrêts")?`<small>${navigator.onLine===false?"Hors ligne : tracé routier non calculé":(S.osrmErr?"Tracé routier indisponible ("+H(S.osrmErr)+") – nouvel essai…":"Calcul du tracé routier…")}</small>`:"";
  return`<div class="nv">${arrowSVG("S",34)}<div><b>${ll?fd(dist(S.pos.la,S.pos.lo,ll[0],ll[1])):""}</b><span>${nx?H((M.stops[nx[0]]||{n:""}).n.split(" - ").pop()):"Terminus"}</span>${sm}</div></div>`}
 if(!ns)return"";
 if(ns.man&&ns.dm<3000){const m=ns.man;return`<div class="nv">${arrowSVG(m.k,34)}<div><b>${fd(ns.dm)}</b><span>${vShort(m)}</span>${m.nm?`<small>${H(m.nm)}</small>`:""}</div></div>`}
 return`<div class="nv">${arrowSVG("S",34)}<div><b>Tout droit</b><span>${fd(ns.rem)} jusqu'à la fin</span></div></div>`;
}
function updateMap(){
 const svg=$("#msvg"),nv=$("#nav");if(!svg||S.view!=="trip")return;const t=M.trips[S.tripId];if(!t)return;
 const bb=svg.getBoundingClientRect(),VH=220,VW=bb.height>0?Math.max(200,Math.min(700,Math.round(VH*bb.width/bb.height))):320,ci=curIdx(t),col=routeColor(M,t.r),P=S.pos;
 if(svg.getAttribute("viewBox")!=="0 0 "+VW+" "+VH)svg.setAttribute("viewBox","0 0 "+VW+" "+VH);
 const SL=t.st.map(x=>stopLL(x[0]));
 const ns=navState();if(nv){const h=navHTML(ns,t,ci);if(nv._h!==h){nv._h=h;nv.innerHTML=h}}voiceNav(ns,t,ci);updateEta();autoReroute(ns);
 if(!svg.querySelector("#ov"))svg.innerHTML=`<rect x="-3000" y="-3000" width="6000" height="6000" fill="#0f1720"/><g id="tl"></g><g id="ov"></g>`;
 const tl=svg.querySelector("#tl"),ov=svg.querySelector("#ov");
 if(!tl._ev){tl._ev=1;tl.addEventListener("load",()=>{S.tileErr=0},true);tl.addEventListener("error",()=>{S.tileErr=(S.tileErr||0)+1;if(S.tileErr>=8){S.tileErr=0;if(S.tileUrl===TILE_OSM)S.tileUrl=TILE_ALT;else if(S.tileUrl===TILE_ALT)S.tileUrl=TILE_OSM;tl._k=""}},true)}
 const free=!!S.free,fit=free||S.mz===4||!P;
 let cx,cy,sd,ang=0,ox=VW/2,oy=fit?VH/2:VH*0.7;
 if(free){cx=S.free.cx;cy=S.free.cy;sd=S.free.sd}
 else if(fit){
  const pts=[];if(S.route)S.route.pts.forEach(q=>pts.push(q));else{SL.forEach(q=>q&&pts.push(q));S.track.forEach(q=>pts.push(q))}if(P)pts.push([P.la,P.lo]);
  if(pts.length<2){tl.innerHTML="";tl._k="";ov.innerHTML=`<text x="12" y="80" fill="#8fa1b3" font-size="12">Recherche du GPS…</text>`;return}
  const xs=pts.map(q=>wxf(q[1])),ys=pts.map(q=>wyf(q[0])),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  cx=(x0+x1)/2;cy=(y0+y1)/2;sd=Math.min((VW-30)/Math.max(x1-x0,1),(VH-30)/Math.max(y1-y0,1),4);
 }else{
  cx=wxf(P.lo);cy=wyf(P.la);sd=[2,1,.5,.25][S.mz]||1;ang=-(S.hd||0);
 }
 S.v0={cx,cy,sd};{const zb=$(".zb3");if(zb)zb.style.display=S.free?"":"none"}
 const ca=Math.cos(ang*RAD),sa=Math.sin(ang*RAD);
 const sc=q=>{const x=(wxf(q[1])-cx)*sd,y=(wyf(q[0])-cy)*sd;return[(ox+x*ca-y*sa).toFixed(1),(oy+x*sa+y*ca).toFixed(1)]};
 let tiles=false;
 if(S.tiles&&navigator.onLine!==false&&S.tileUrl){
  const zt=Math.max(11,Math.min(18,Math.round(16+Math.log2(sd)))),size=256*Math.pow(2,16-zt),r=Math.hypot(VW,VH)/sd/2*1.05,off=fit?0:(oy-VH/2)/sd;
  const key=zt+":"+Math.floor(cx/size)+":"+Math.floor(cy/size)+":"+(fit?1:0);
  if(tl._k!==key){tl._k=key;const rr=r+Math.abs(off)+size;let im="",cnt=0;
   for(let tx=Math.floor((cx-rr)/size);tx<=Math.floor((cx+rr)/size)&&cnt<30;tx++)for(let ty=Math.floor((cy-rr)/size);ty<=Math.floor((cy+rr)/size)&&cnt<30;ty++){
    if(ty<0||ty>=Math.pow(2,zt))continue;cnt++;
    im+=`<image href="${S.tileUrl.replace("{z}",zt).replace("{x}",((tx%Math.pow(2,zt))+Math.pow(2,zt))%Math.pow(2,zt)).replace("{y}",ty)}" x="${tx*size}" y="${ty*size}" width="${size+.6}" height="${size+.6}"/>`}
   tl.innerHTML=im}
  tl.setAttribute("transform",`translate(${ox},${oy}) rotate(${ang}) scale(${sd}) translate(${-cx},${-cy})`);tl.setAttribute("opacity",".92");tiles=true;
 }else if(tl._k){tl.innerHTML="";tl._k=""}
 let out="";
 const line=(arr,st,wd,op,dash)=>arr.length>1?`<polyline fill="none" stroke="${st}" stroke-width="${wd}" opacity="${op}" ${dash?'stroke-dasharray="5 4"':""} stroke-linecap="round" stroke-linejoin="round" points="${arr.map(q=>sc(q).join(",")).join(" ")}"/>`:"";
 if(S.route&&S.route.src!=="arrêts"){const R=S.route,a=ns&&!ns.off?ns.idx:0;
  out+=line(R.pts.slice(0,a+1),"#6b7a8a",7,.7);
  out+=line(R.pts.slice(a),"#ffffff",11,.95);out+=line(R.pts.slice(a),"#2f7df6",7,1);
 }else{out+=line(SL.filter(Boolean),"#ffffff",9,.9);out+=line(SL.filter(Boolean),col,5,1,true);out+=line(S.track,"#2f7df6",4,1)}
 SL.forEach((q,i)=>{if(!q)return;const[x,y]=sc(q),cur=i===ci;out+=`<circle cx="${x}" cy="${y}" r="${cur?8:4.5}" fill="${S.passed[i]!=null?col:"#fff"}" stroke="${cur?"#f2c230":"#0f1720"}" stroke-width="${cur?3:1.5}"/>`});
 for(let i=ci;i<=Math.min(ci+2,t.st.length-1);i++){const q=SL[i];if(!q)continue;const[x,y]=sc(q);if(x<0||x>VW||y<0||y>VH)continue;
  const nm=(M.stops[t.st[i][0]]||{n:""}).n.split(" - ").pop().slice(0,22);out+=`<text x="${(+x+10).toFixed(1)}" y="${(+y+3).toFixed(1)}" font-size="${i===ci?11:9}" font-weight="${i===ci?700:500}" fill="#fff" stroke="#0f1720" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${H(nm)}</text>`}
 if(P){const[x,y]=sc([P.la,P.lo]),rot=fit?(S.hd||0):0;out+=`<circle cx="${x}" cy="${y}" r="14" fill="#2f7df6" opacity=".2"/><path d="M0,-12 L9,10 L0,5 L-9,10Z" fill="#fff" stroke="#0b3d91" stroke-width="2" transform="translate(${x},${y}) rotate(${rot})"/>`}

 const al=/cartocdn/.test(S.tileUrl||"")?"© OpenStreetMap © CARTO":"© OpenStreetMap";
 ov.innerHTML=out+`<text x="4" y="${VH-4}" font-size="8" fill="#b6c4d2" stroke="#0f1720" stroke-width="2" paint-order="stroke">${S.gps?(P?"📡 ±"+Math.round(P.acc)+" m":"📡 recherche…"):"📡 GPS off"}${tiles?" · "+al:""}</text>`;
}

/* ============ Carte : déplacer / zoomer avec les doigts ============ */
const zclamp=x=>Math.min(6,Math.max(.04,x));
function mapView(){if(!S.free&&S.v0)S.free={cx:S.v0.cx,cy:S.v0.cy,sd:S.v0.sd};return S.free}
function freeTouch(){clearTimeout(S.freeT);S.freeT=setTimeout(()=>{S.free=null;if(S.view==="trip")updateMap()},25000)}
let mapRaf=0;const mapSched=()=>{if(mapRaf)return;mapRaf=requestAnimationFrame(()=>{mapRaf=0;updateMap()})};
function bindMap(){
 const mp=$("#mp");if(!mp||mp._b)return;mp._b=1;
 const ptr=new Map();let acc=0;
 const upp=()=>{const bb=$("#msvg").getBoundingClientRect();return bb.height>0?220/bb.height:1};
 mp.addEventListener("pointerdown",e=>{if(!e.target.closest("svg"))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);acc=0;try{mp.setPointerCapture(e.pointerId)}catch(_){}});
 mp.addEventListener("pointermove",e=>{const pv=ptr.get(e.pointerId);if(!pv)return;const cu=[e.clientX,e.clientY];
  if(ptr.size===1){const dx=cu[0]-pv[0],dy=cu[1]-pv[1];acc+=Math.hypot(dx,dy);if(acc>8){const f=mapView();if(f){const k=upp();f.cx-=dx*k/f.sd;f.cy-=dy*k/f.sd;freeTouch();mapSched()}}}
  else if(ptr.size>=2){const o=[...ptr.entries()].find(x=>x[0]!==e.pointerId)[1],d0=Math.hypot(pv[0]-o[0],pv[1]-o[1]),d1=Math.hypot(cu[0]-o[0],cu[1]-o[1]);if(d0>10){const f=mapView();if(f){f.sd=zclamp(f.sd*d1/d0);acc=99;freeTouch();mapSched()}}}
  ptr.set(e.pointerId,cu)});
 const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(acc>8)S.noClickUntil=Date.now()+400;if(!ptr.size)acc=0};
 mp.addEventListener("pointerup",up);mp.addEventListener("pointercancel",up);
 mp.addEventListener("wheel",e=>{e.preventDefault();const f=mapView();if(f){f.sd=zclamp(f.sd*Math.exp(-e.deltaY*.002));freeTouch();mapSched()}},{passive:false});
}

/* ============ Événements globaux ============ */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a],[data-r],[data-t],[data-i],[data-f],[data-tr]");if(!el||e.target.closest(".modal"))return;
 const d=el.dataset;
 if(d.f){S.filter=d.f;render();return}
 if(d.r){S.route=d.r;S.view="trips";render();return}
 if(d.t){S.tripId=d.t;S.at=null;S.free=null;S.passed={};S.tags={};S.notes={};S.traffic="";S.lastArr=-1;S.refSaved=false;S.startedAt=Date.now();S.view="trip";S.lastArrAt=0;loadTracks(true);buildRoute();saveSession();Wake.on();if(S.gps)startGPS();render();if(!S.route&&navigator.onLine)fetchOSRM();return}
 if(d.i!=null){stopSheet(+d.i);return}
 if(d.tr){S.traffic=S.traffic===d.tr?"":d.tr;const t=M.trips[S.tripId],i=curIdx(t);const k=Math.min(i,t.st.length-1);if(S.traffic&&S.traffic!=="Fluide")S.tags[k]=S.traffic;saveSession();render();return}
 switch(d.a){
  case"settings":settings();break;
  case"back":if(S.view==="trip"){saveSession();stopGPS();S.at=null;clearTimeout(S.endT);S.endT=null;S.tripId=null}S.view="home";render();break;
  case"arrive":arrive(null,null,true);break;
  case"saveref":finishTrack();S.refSaved=true;render();break;
  case"sync":{if(!resync(true)){const m=openSheet(`<h2>Position non trouvée</h2><div class="mut">Le GPS n'a pas de position précise, ou tu es trop loin des arrêts de cette course. Réessaie dans quelques secondes, ou touche un arrêt dans la liste puis « Je suis ici ».</div><button data-x="close">Fermer</button>`);m.addEventListener("click",e=>{if(e.target.closest("[data-x]"))m.remove()})}break}
  case"voice":{S.voice=!S.voice;ss("bt_voice",S.voice);const b=$(".vbtn");if(b)b.textContent=S.voice?"🔊":"🔇";if(S.voice)say("Guidage vocal activé",true);else try{speechSynthesis.cancel()}catch(e){}break}
  case"mapz":if(Date.now()<(S.noClickUntil||0))break;if(S.free){S.free=null;clearTimeout(S.freeT)}else{S.mz=((S.mz??1)+1)%5;ss("bt_mz2",S.mz)}updateMap();break;
  case"zin":case"zout":{const f=mapView();if(f){f.sd=zclamp(f.sd*(d.a==="zin"?1.5:1/1.5));freeTouch()}updateMap();break}
  case"zfree":S.free=null;clearTimeout(S.freeT);updateMap();break;
  case"undo":{const t=M.trips[S.tripId];const ks=Object.keys(S.passed).map(Number);if(!ks.length)break;const k=Math.max(...ks);delete S.passed[k];S.lastArr=ks.filter(x=>x!==k).length?Math.max(...ks.filter(x=>x!==k)):-1;saveSession();render();break}
  case"end":doEnd();break;
  case"keeptrace":finishTrack();doEnd();break;
  case"resume":{const s=sg("bt_session",null);if(s){S.at=null;S.free=null;Object.assign(S,{date:s.date,tripId:s.tripId,passed:s.passed||{},tags:s.tags||{},notes:s.notes||{},traffic:s.traffic||"",startedAt:s.startedAt,lastArr:s.lastArr??-1,view:"trip"});loadTracks(false);buildRoute();Wake.on();if(S.gps)startGPS();render()}break}
  case"drop":S.tripId=null;saveSession();render();break;
  case"demo":(async()=>{M=withMine(demoModel());await DB.set("gtfs",M);S.view="home";render()})();break;
 }
});
window.addEventListener("error",()=>{/* l'appli ne doit jamais se bloquer : on réaffiche */});
window.addEventListener("beforeunload",saveSession);

/* ============ Démarrage ============ */
(async()=>{
 applyPrefs();
 {const sv0=await DB.get("gtfs");M=withMine(sv0&&sv0.meta&&sv0.meta.user?sv0:null);}
 const s=sg("bt_session",null);
 if(M&&s&&M.trips[s.tripId]&&Date.now()-s.t<4*3600e3){
  Object.assign(S,{date:s.date,tripId:s.tripId,passed:s.passed||{},tags:s.tags||{},notes:s.notes||{},traffic:s.traffic||"",startedAt:s.startedAt,lastArr:s.lastArr??-1,view:"trip"});loadTracks(false);buildRoute();
 }
 render();
 Wake.on();if(S.view==="trip"&&S.gps)startGPS();
})();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
